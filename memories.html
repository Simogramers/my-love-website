<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f5">
  <title>Her Little Gallery ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="floating-hearts" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-heart">♥</span> just for you</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a class="active" href="memories.html">Her Gallery</a>
      <a href="letter.html">A Letter</a>
    </nav>
  </header>

  <main class="content-page">
    <div class="page-heading">
      <p class="eyebrow">the prettiest view ♡</p>
      <h1>A gallery of <em>you.</em></h1>
      <p>Because some people make every picture feel a little more beautiful.</p>
    </div>

    <section class="photo-grid" aria-label="Photo gallery">
      <figure class="polaroid tilt-left">
        <img src="images/her-photo-1.JPG" alt="Her smiling" onerror="this.onerror=null;this.src='https://placehold.co/700x850/ffe1eb/b65d7d?text=Her+photo+1';">
        <figcaption>that lovely smile ♡</figcaption>
      </figure>
      <figure class="polaroid tilt-right">
        <img src="images/her-photo-2.JPG" alt="A favorite picture of her" onerror="this.onerror=null;this.src='https://placehold.co/700x850/ffe8ef/b65d7d?text=Her+photo+2';">
        <figcaption>pretty in every way</figcaption>
      </figure>
      <figure class="polaroid tilt-right">
        <img src="images/her-photo-3.jpg" alt="Another favorite picture of her" onerror="this.onerror=null;this.src='https://placehold.co/700x850/ffdae7/b65d7d?text=Her+photo+3';">
        <figcaption>a moment to keep</figcaption>
      </figure>
    </section>

    <div class="center-note">
      <span class="tiny-flower">✿</span>
      <p>Not just pictures. Little reminders of how lovely you are.</p>
      <a class="button button-outline" href="letter.html">There's a note for you <span>→</span></a>
    </div>
  </main>
  <footer class="site-footer">♡ made with a little extra love ♡</footer>
</body>
</html>
